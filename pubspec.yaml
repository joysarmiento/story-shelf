# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  # assets:
  #   - assets/images/
  assets:
    - .env
    - docs/assets/images/logo.png
    - docs/assets/images/story-shelf-wordmark.png   
    - docs/assets/images/your-shelf-wordmark.png  
    - docs/assets/images/library-wordmark.png  
    - docs/assets/images/memories-wordmark.png  

  fonts:
    - family: Railey
      fonts:
        - asset: docs/assets/fonts/Railey-PersonalUse.ttf
    